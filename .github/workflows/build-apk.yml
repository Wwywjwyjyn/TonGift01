name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter android project
        run: flutter create . --org com.giftmarket --project-name gift_market --platforms android

      - name: Apply android overlay
        run: |
          cp -f android_overlay/app/build.gradle android/app/build.gradle
          cp -f android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Fix Dart code errors
        run: |
          sed -i "1i import '../core/strings.dart';" lib/providers/core_providers.dart
          for f in lib/providers/inventory_provider.dart lib/providers/market_provider.dart lib/widgets/common.dart; do sed -i "1i import '../services/api_client.dart';" $f; done
          for f in lib/screens/inventory/inventory_screen.dart lib/screens/premium/premium_screen.dart lib/screens/stars/stars_screen.dart lib/screens/market/collections_screen.dart; do sed -i "1i import '../../services/api_client.dart';" $f; done
          sed -i "1i import 'package:cached_network_image/cached_network_image.dart';" lib/widgets/wallet_sheet.dart
          sed -i 's/await _manager!.generateWalletLink(wallet);/_manager!.generateWalletLink(wallet);/' lib/services/tonconnect_service.dart
          sed -i 's/\bm\.wallets/svc.wallets/g' lib/providers/wallet_provider.dart

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gift-market-apk
          path: build/app/outputs/flutter-apk/app-release.apk